<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>transaction_db</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a21;
    --line: #262c36;
    --fg: #d7dce3;
    --dim: #8b94a3;
    --accent: #5aa9e6;
    --ok: #6fcf97;
    --err: #eb5757;
    --null: #7a839a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex;
    background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  aside {
    width: 260px; flex: none; border-right: 1px solid var(--line);
    padding: 14px; overflow-y: auto; background: var(--panel);
  }
  aside h1 { font-size: 13px; margin: 0 0 4px; letter-spacing: .04em; }
  aside .sub { color: var(--dim); font-size: 11px; margin-bottom: 14px; }
  .tbl { margin-bottom: 12px; }
  .tbl > button {
    all: unset; cursor: pointer; color: var(--accent); font-weight: 600;
  }
  .tbl ul { list-style: none; margin: 4px 0 0; padding: 0 0 0 10px; }
  .tbl li { color: var(--dim); font-size: 12px; }
  .tbl li b { color: var(--fg); font-weight: 400; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .editor { border-bottom: 1px solid var(--line); padding: 12px; }
  textarea {
    width: 100%; height: 110px; resize: vertical;
    background: #0b0d11; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 10px; font: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .bar { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  button.run {
    background: var(--accent); color: #08111a; border: 0; border-radius: 6px;
    padding: 7px 16px; font: inherit; font-weight: 700; cursor: pointer;
  }
  button.run:disabled { opacity: .5; cursor: default; }
  .chip {
    all: unset; cursor: pointer; color: var(--dim); font-size: 12px;
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px;
  }
  .chip:hover { color: var(--fg); border-color: var(--accent); }
  .hint { color: var(--dim); font-size: 11px; margin-left: auto; }
  #status { font-size: 12px; }
  #status.tx { color: var(--ok); }
  #out { flex: 1; overflow-y: auto; padding: 12px; }
  .entry { margin-bottom: 18px; }
  .q { color: var(--accent); white-space: pre-wrap; margin-bottom: 6px; }
  .q::before { content: "sql> "; color: var(--dim); }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--err); white-space: pre-wrap; }
  table { border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid var(--line); padding: 3px 10px; text-align: left; }
  th { color: var(--dim); font-weight: 600; background: #11151b; }
  td.null { color: var(--null); font-style: italic; }
  td.num { text-align: right; }
  .count { color: var(--dim); font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>

<aside>
  <h1>transaction_db</h1>
  <div class="sub">SQL client</div>
  <div id="schema"></div>
</aside>

<main>
  <div class="editor">
    <textarea id="sql" spellcheck="false"
      placeholder="CREATE TABLE fruit (name VARCHAR, price INTEGER);"></textarea>
    <div class="bar">
      <button class="run" id="run">Run</button>
      <button class="chip" data-sql="BEGIN;">BEGIN</button>
      <button class="chip" data-sql="COMMIT;">COMMIT</button>
      <button class="chip" data-sql="ROLLBACK;">ROLLBACK</button>
      <span id="status"></span>
      <span class="hint">Ctrl+Enter で実行 / 複数文は ; 区切り</span>
    </div>
  </div>
  <div id="out"></div>
</main>

<script>
const $ = s => document.querySelector(s);
const out = $("#out"), sqlBox = $("#sql");

// -- 実行 ---------------------------------------------------------------
async function runOne(sql) {
  const res = await fetch("/api/web_ui:query", { method: "POST", body: sql });
  return res.json();
}

async function run() {
  const text = sqlBox.value.trim();
  if (!text) return;
  $("#run").disabled = true;
  try {
    for (const sql of splitStatements(text)) {
      render(await runOne(sql));
    }
    await refresh();
  } catch (e) {
    render({ sql: text, result: { kind: "error", message: String(e) } });
  } finally {
    $("#run").disabled = false;
  }
}

// 文字列リテラル内の ; では切らない
function splitStatements(text) {
  const stmts = [];
  let cur = "", inStr = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c === "'" ) {
      // '' はエスケープされた引用符
      if (inStr && text[i + 1] === "'") { cur += "''"; i++; continue; }
      inStr = !inStr;
      cur += c;
    } else if (c === ";" && !inStr) {
      if (cur.trim()) stmts.push(cur.trim());
      cur = "";
    } else {
      cur += c;
    }
  }
  if (cur.trim()) stmts.push(cur.trim());
  return stmts;
}

// -- 表示 ---------------------------------------------------------------
function render({ sql, result }) {
  const e = el("div", "entry");
  e.append(el("div", "q", sql));
  if (result.kind === "rows") {
    if (result.count > 0) e.append(table(result));
    e.append(el("div", "count", `(${result.count} row${result.count === 1 ? "" : "s"})`));
  } else if (result.kind === "ok") {
    e.append(el("div", "msg ok", result.message));
  } else {
    e.append(el("div", "msg err", "ERROR: " + result.message));
  }
  out.append(e);
  out.scrollTop = out.scrollHeight;
}

function table({ columns, rows }) {
  const t = document.createElement("table");
  const hr = t.insertRow();
  columns.forEach(c => { const th = document.createElement("th"); th.textContent = c; hr.append(th); });
  rows.forEach(r => {
    const tr = t.insertRow();
    r.forEach(cell => {
      const td = tr.insertCell();
      td.textContent = cell.v;
      if (cell.t === "null") td.className = "null";
      else if (cell.t === "num") td.className = "num";
    });
  });
  return t;
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

// -- スキーマとセッション -------------------------------------------------
async function refresh() {
  const [{ tables }, sess] = await Promise.all([
    fetch("/api/web_ui:tables").then(r => r.json()),
    fetch("/api/web_ui:session").then(r => r.json()),
  ]);

  const box = $("#schema");
  box.textContent = "";
  if (!tables.length) box.append(el("div", "sub", "no tables"));
  tables.forEach(t => {
    const d = el("div", "tbl");
    const b = el("button", "", t.name);
    b.onclick = () => insert(`SELECT * FROM ${t.name};`);
    d.append(b);
    const ul = document.createElement("ul");
    t.columns.forEach(c => {
      const li = document.createElement("li");
      li.append(el("b", "", c.name), document.createTextNode(" " + c.type));
      ul.append(li);
    });
    d.append(ul);
    box.append(d);
  });

  const s = $("#status");
  s.textContent = sess.tx_active ? "● in transaction" : "○ no transaction";
  s.className = sess.tx_active ? "tx" : "";
}

function insert(text) {
  sqlBox.value = text;
  sqlBox.focus();
}

// -- 配線 ---------------------------------------------------------------
$("#run").onclick = run;
sqlBox.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
});
document.querySelectorAll(".chip").forEach(b => {
  b.onclick = async () => { render(await runOne(b.dataset.sql.replace(";", ""))); refresh(); };
});
refresh();
</script>
</body>
</html>
