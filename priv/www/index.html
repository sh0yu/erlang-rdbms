<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>tether — local-first</title>
<style>
  :root{--bg:#0f1115;--panel:#161a21;--line:#262c36;--fg:#d7dce3;--dim:#8b94a3;
        --accent:#5aa9e6;--ok:#6fcf97;--warn:#f2c94c;--err:#eb5757;--off:#7a839a;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{margin:0;font-size:15px;letter-spacing:.04em}
  header p{margin:6px 0 0;color:var(--dim);font-size:12px}
  .try{margin-top:8px;font-size:12px;color:var(--dim)}
  .try b{color:var(--accent);font-weight:600}
  main{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;padding:16px;
       align-items:start;max-width:1400px;margin:0 auto}
  /* min-width:0 が無いと、ボタン列の幅で列が押し広げられて右がはみ出す */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:14px;min-width:0;overflow:hidden}
  .card.server{border-color:#33405a}
  .card h2{margin:0 0 2px;font-size:14px;display:flex;align-items:center;gap:8px}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
  .on{background:rgba(111,207,151,.15);color:var(--ok)}
  .off{background:rgba(122,131,154,.18);color:var(--off)}
  .stats{display:flex;flex-wrap:wrap;gap:4px 14px;margin:10px 0;font-size:12px;
         color:var(--dim)}
  .stats b{color:var(--fg);font-weight:600}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
  button{background:#1e2530;color:var(--fg);border:1px solid var(--line);
         border-radius:6px;padding:6px 10px;font:inherit;font-size:12px;
         cursor:pointer;white-space:nowrap}
  button:hover{border-color:var(--accent);color:#fff}
  button.net{background:var(--accent);color:#08111a;border:0;font-weight:700}
  button.net.isoff{background:var(--off);color:#0c0f14}
  ul{list-style:none;margin:0;padding:0;font-size:12px;
     max-height:340px;overflow-y:auto}
  li{display:flex;justify-content:space-between;gap:8px;padding:3px 8px;
     border-radius:4px;border-left:3px solid transparent;
     overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  li .v{color:var(--dim)}
  li.local{border-left-color:var(--warn);background:rgba(242,201,76,.08)}
  li.missing{border-left-color:var(--err);background:rgba(235,87,87,.08);opacity:.75}
  .legend{margin-top:10px;font-size:11px;color:var(--dim);line-height:1.9}
  .sw{display:inline-block;width:9px;height:9px;border-radius:2px;
      margin-right:5px;vertical-align:middle}
  .empty{color:var(--dim);font-size:12px;padding:4px 8px}
  .pool{display:flex;gap:6px;margin:8px 0 2px}
  .bar{height:22px;border-radius:4px;display:flex;align-items:center;
       justify-content:center;font-size:11px;font-weight:700;color:#0c0f14}
  .bar.a{background:var(--ok)} .bar.g{background:var(--warn)}
</style>
</head>
<body>

<header>
  <h1>tether — セッションが接続より長生きするデータベース</h1>
  <p>端末2台とサーバ。圏外にすると手元だけが進み、同期すると揃う。</p>
  <p class="try">
    試す順:
    <b>① alice を圏外にする</b> →
    <b>② 預かりを取る…は圏外では失敗する</b> →
    <b>③ 圏内で預かりを取ってから圏外へ</b> →
    <b>④ 圏外で「1個売る」</b>（中央在庫は動かない） →
    <b>⑤ 「在庫を空にする」</b> →
    <b>⑥ alice を圏内に戻して同期</b>（それでも売上は通る）
  </p>
</header>

<main id="app"></main>

<script>
const $ = s => document.querySelector(s);
let S = null;

async function load()      { S = await (await fetch("/api/tether_web:state")).json(); draw(); }
async function act(c, a)   { S = await (await fetch("/api/tether_web:act",
                               {method:"POST", body:`client=${c}&action=${a}`})).json(); draw(); }

function el(tag, cls, txt) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt !== undefined) n.textContent = txt;
  return n;
}

// サーバが持っている鍵の集合。手元との差を色で出す。
function serverKeys() { return new Set(S.server.orders.map(o => o.key)); }

function draw() {
  const app = $("#app");
  app.textContent = "";
  const [a, b] = S.clients;
  app.append(clientCard(a), serverCard(), clientCard(b));
}

function clientCard(c) {
  const card = el("div", "card");
  const h = el("h2", "", c.name);
  h.append(el("span", "badge " + (c.online ? "on" : "off"),
              c.online ? "圏内" : "圏外"));
  card.append(h);

  const st = el("div", "stats");
  st.innerHTML = `版 <b>${c.version}</b>　送信待ち <b>${c.queued}</b>　預かり <b>${c.grant}</b>`;
  card.append(st);

  const btns = el("div", "btns");
  const net = el("button", "net" + (c.online ? "" : " isoff"),
                 c.online ? "圏外にする" : "圏内に戻す");
  net.onclick = () => act(c.name, c.online ? "offline" : "online");
  btns.append(net);
  [["メモを書く","write"],["預かりを取る","acquire"],["1個売る","sell"],["同期","sync"]]
    .forEach(([label, action]) => {
      const btn = el("button", "", label);
      btn.onclick = () => act(c.name, action);
      btns.append(btn);
    });
  card.append(btns);

  const sk = serverKeys();
  const ck = new Set(c.orders.map(o => o.key));
  const ul = el("ul");
  c.orders.forEach(o => {
    const li = el("li", sk.has(o.key) ? "" : "local");
    li.append(el("span", "", o.key), el("span", "v", o.value));
    ul.append(li);
  });
  // サーバにあって手元に無いもの
  S.server.orders.filter(o => !ck.has(o.key)).forEach(o => {
    const li = el("li", "missing");
    li.append(el("span", "", o.key), el("span", "v", "未受信"));
    ul.append(li);
  });
  card.append(ul.children.length ? ul : el("div", "empty", "(空)"));

  const lg = el("div", "legend");
  lg.innerHTML =
    `<span class="sw" style="background:var(--warn)"></span>手元だけ(未送信)<br>` +
    `<span class="sw" style="background:var(--err)"></span>サーバにあるが未受信`;
  card.append(lg);
  return card;
}

function serverCard() {
  const s = S.server;
  const card = el("div", "card server");
  card.append(el("h2", "", "サーバ"));

  const st = el("div", "stats");
  st.innerHTML = `版 <b>${s.version}</b>　中央在庫 <b>${s.available}</b>　配ってある <b>${s.granted}</b>`;
  card.append(st);

  // 在庫の内訳を棒で
  const total = s.available + s.granted || 1;
  const pool = el("div", "pool");
  if (s.available) {
    const d = el("div", "bar a", String(s.available));
    d.style.flex = s.available; pool.append(d);
  }
  if (s.granted) {
    const d = el("div", "bar g", String(s.granted));
    d.style.flex = s.granted; pool.append(d);
  }
  if (!s.available && !s.granted) pool.append(el("div", "empty", "在庫なし"));
  card.append(pool);
  card.append(el("div", "legend",
                 "緑=中央に残っている　黄=端末に配ってある(未消費)"));

  const btns = el("div", "btns");
  [["第三者が書く","server_write"],["在庫を空にする","drain"]]
    .forEach(([label, action]) => {
      const btn = el("button", "", label);
      btn.onclick = () => act("alice", action);
      btns.append(btn);
    });
  card.append(btns);

  const ul = el("ul");
  s.orders.forEach(o => {
    const li = el("li");
    li.append(el("span", "", o.key), el("span", "v", o.value));
    ul.append(li);
  });
  card.append(ul.children.length ? ul : el("div", "empty", "(空)"));
  return card;
}

load();
setInterval(load, 1000);
</script>
</body>
</html>
