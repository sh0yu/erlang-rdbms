<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>分散DBの系譜 — tether</title>
<style>
  :root{--bg:#0f1115;--panel:#161a21;--line:#262c36;--fg:#d7dce3;--dim:#8b94a3;
        --accent:#5aa9e6;--ok:#6fcf97;--warn:#f2c94c;--err:#eb5757;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.75 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header{padding:11px 20px;border-bottom:1px solid var(--line);background:var(--panel);
         display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
  header h1{margin:0;font-size:14px}
  header a{color:var(--accent);font-size:12px;text-decoration:none}
  header .sp{margin-left:auto;display:flex;gap:5px;align-items:center}
  button{background:#1e2530;color:var(--fg);border:1px solid var(--line);
         border-radius:6px;padding:4px 10px;font:inherit;font-size:11px;cursor:pointer}
  button:hover{border-color:var(--accent);color:#fff}
  button.on{background:var(--accent);color:#08111a;border:0;font-weight:700}
  .wrap{display:grid;grid-template-columns:270px 1fr;gap:0;align-items:start}
  nav{border-right:1px solid var(--line);padding:14px 0 60px;position:sticky;top:47px;
      max-height:calc(100vh - 47px);overflow-y:auto}
  nav .ch{font-size:11.5px;color:var(--dim);padding:12px 16px 4px;font-weight:700}
  nav .ch:first-child{padding-top:2px}
  nav a{display:block;padding:4px 16px 4px 22px;font-size:12px;color:#aeb6c2;
        text-decoration:none;border-left:3px solid transparent}
  nav a:hover{color:#fff;background:#181d25}
  nav a.on{color:#fff;border-left-color:var(--accent);background:#1a2029}
  main{padding:22px 26px 80px;max-width:1050px;min-width:0}
  h2{font-size:18px;margin:0 0 4px}
  .kind{font-size:10.5px;color:var(--dim);margin-bottom:12px}
  .why{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
       border-radius:0 8px 8px 0;padding:12px 15px;font-size:13px;color:#c3cad4;margin:0 0 20px}
  b{color:var(--fg)}
  .why b{color:#fff}
  table{width:100%;border-collapse:collapse;margin:6px 0 14px;font-size:12.5px}
  th{text-align:left;color:var(--dim);font-weight:600;padding:6px 10px;
     border-bottom:1px solid var(--line);font-size:11.5px;white-space:nowrap}
  td{padding:7px 10px;border-bottom:1px solid #1c222b;vertical-align:top}
  tr.bad td{background:rgba(235,87,87,.10)}
  tr.bad td:first-child{border-left:3px solid var(--err)}
  tr.now td{background:#1d2634}
  tr.hide{display:none}
  td.who{color:var(--accent);white-space:nowrap}
  td.st{color:var(--warn);white-space:nowrap}
  td.note{color:var(--dim)}
  .lab td{background:var(--panel);border:1px solid var(--line);border-radius:8px}
  .lab td.chg{background:#1d2634;border-color:var(--accent)}
  .fix{background:#12181f;border:1px solid var(--line);border-radius:8px;
       padding:11px 14px;font-size:12.5px;color:#b9c1cc;margin:14px 0}
  .fix .h{color:var(--ok);font-size:11px;font-weight:700;display:block;margin-bottom:3px}
  .fix.how{border-left:3px solid var(--accent)}
  .fix.how .h{color:var(--accent)}
  .fix.how div{padding:2px 0}
  .fix code{background:#0c1016;border:1px solid var(--line);border-radius:4px;
            padding:1px 6px;color:var(--warn);font-size:12px}
  .sec{margin:0 0 18px}
  .sec h3{font-size:14px;margin:0 0 6px;color:#dfe5ec}
  .sec p{margin:0 0 8px;font-size:13px;color:#c3cad4}
  .sec .it{display:flex;gap:10px;padding:4px 0;font-size:12.5px}
  .sec .it .n{color:var(--accent);min-width:190px;font-weight:600}
  .sec .it .d{color:#aeb6c2}
  .note{font-size:12px;color:var(--dim);border-top:1px solid var(--line);
        padding-top:10px;margin-top:14px}
  .v{padding:8px 12px;border-radius:7px;margin-bottom:4px;font-size:12.5px;
     background:var(--panel);border-left:3px solid var(--err)}
  .v.good{border-left-color:var(--ok)}
  .v .who{color:var(--fg);font-weight:700;margin-right:10px}
  .v .mark{margin-right:8px;color:var(--err)} .v.good .mark{color:var(--ok)}
  .see{font-size:11.5px;color:var(--dim);margin-top:10px}
  .see a{color:var(--accent);text-decoration:none;margin-right:10px}
  .nav2{display:flex;gap:8px;margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
  /* 選び方の木 */
  .flow{margin-bottom:20px}
  .trail{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
  .crumb{font-size:11px;color:var(--dim);background:#141920;padding:3px 9px}
  .crumb.reset{color:var(--accent)}
  .q{font-size:16px;margin:0 0 12px;color:#fff}
  .opt{display:block;width:100%;text-align:left;padding:11px 14px;margin-bottom:7px;
       font-size:13.5px;line-height:1.6;background:var(--panel)}
  .opt:hover{background:#1d2634;border-color:var(--accent)}
  .ans{background:var(--panel);border:1px solid var(--ok);border-radius:10px;padding:16px 18px}
  .atitle{font-size:17px;color:var(--ok);font-weight:700;margin-bottom:8px}
  .abody{font-size:13px;color:#c3cad4;margin-bottom:10px}
  .picks{list-style:none;margin:0;padding:0}
  .picks li{padding:4px 0 4px 16px;font-size:12.5px;color:#aeb6c2;position:relative}
  .picks li:before{content:"▸";position:absolute;left:0;color:var(--accent)}
  .tree{margin-top:8px;font-size:12px}
  .tree summary{color:var(--dim);cursor:pointer;padding:6px 0}
  .tn{margin:10px 0 14px;padding-left:12px;border-left:2px solid var(--line)}
  .tq{color:#dfe5ec;margin-bottom:4px}
  .to{color:#9aa3b0;padding:2px 0 2px 14px}
  .to .arw{color:var(--accent);margin:0 6px}
</style>
</head>
<body>

<header>
  <h1>分散DBの系譜 — 競合・ロック・分散の類型・何がどれを防ぐか</h1>
  <a href="/">← 実装のデモ（端末2台とサーバ）</a>
  <span class="sp">
    <button id="replay">この項目をもう一度</button>
    <button data-sp="1500" class="on">ふつう</button>
    <button data-sp="800">速い</button>
    <button data-sp="2600">ゆっくり</button>
  </span>
</header>

<div class="wrap">
  <nav id="toc"></nav>
  <main id="main"></main>
</div>

<script>
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;
                   if(x!==undefined)n.textContent=x;return n;};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const md=s=>String(s||"").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
                         .replace(/`([^`]+)`/g,"<code>$1</code>");
const KIND={timeline:"時系列で追う",compare:"方式を並べて比べる",
            matrix:"表で見る",notes:"整理",flow:"押して辿る"};

let BOOK=[], FLAT=[], speed=1500, run=0, cur=null;

async function boot(){
  BOOK = await (await fetch("/api/tether_web:book",{cache:"no-store"})).json();
  const toc=$("#toc");
  BOOK.forEach(ch=>{
    toc.append(el("div","ch",ch.title));
    ch.items.forEach(it=>{
      it.chapter = ch.title;
      const a=el("a","",it.title); a.href="#"+it.id; a.dataset.id=it.id;
      a.onclick=e=>{e.preventDefault(); show(it.id);};
      toc.append(a); FLAT.push(it);
    });
  });
  document.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>{
    speed=+b.dataset.sp;
    document.querySelectorAll("[data-sp]").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
  });
  $("#replay").onclick=()=>cur&&show(cur);
  // ハッシュ直打ち・戻る/進むに追随する。
  // これが無いと、リンクを開いても項目が変わらない(実際にそうなっていた)。
  window.addEventListener("hashchange",()=>{
    const id=location.hash.slice(1);
    if(id && id!==cur) show(id);
  });
  show(location.hash.slice(1)||FLAT[0].id);
}

function show(id){
  const it=FLAT.find(x=>x.id===id)||FLAT[0];
  cur=it.id; location.hash=it.id;
  document.querySelectorAll("nav a").forEach(a=>
    a.classList.toggle("on", a.dataset.id===it.id));
  const m=$("#main"); m.textContent=""; m.scrollIntoView&&window.scrollTo(0,0);
  m.append(el("h2","",it.title));
  m.append(el("div","kind",(it.chapter?it.chapter+"　/　":"")+(KIND[it.kind]||"")));
  const w=el("div","why"); w.innerHTML=md(it.why); m.append(w);

  const me=++run;
  if(it.kind==="flow") flow(m,it);
  else if(it.kind==="timeline") timeline(m,it,me);
  else if(it.kind==="compare") compare(m,it,me);
  else if(it.kind==="matrix") matrix(m,it);
  else notes(m,it);

  if(it.how){
    const h=el("div","fix how");
    h.innerHTML='<span class="h">具体的には</span>'+
                md(it.how).split("\n").map(x=>"<div>"+x+"</div>").join("");
    m.append(h);
  }
  if(it.fix&&it.fix!=="—"){
    const f=el("div","fix"); f.innerHTML='<span class="h">どう防ぐか</span>'+md(it.fix);
    m.append(f);
  }
  if(it.note&&it.note.length){const n=el("div","note"); n.innerHTML=md(it.note); m.append(n);}
  if(it.seealso&&it.seealso.length){
    const s=el("div","see"); s.append(el("span","","関連: "));
    it.seealso.forEach(sid=>{
      const t=FLAT.find(x=>x.id===sid); if(!t) return;
      const a=el("a","",t.title); a.href="#"+sid;
      a.onclick=e=>{e.preventDefault(); show(sid);}; s.append(a);
    });
    m.append(s);
  }
  const nv=el("div","nav2");
  const i=FLAT.findIndex(x=>x.id===it.id);
  if(i>0){const b=el("button","","← "+FLAT[i-1].title);
          b.onclick=()=>show(FLAT[i-1].id); nv.append(b);}
  if(i<FLAT.length-1){const b=el("button","",FLAT[i+1].title+" →");
                      b.onclick=()=>show(FLAT[i+1].id); nv.append(b);}
  m.append(nv);
}

async function timeline(m,it,me){
  const tb=el("table"), th=el("tr");
  ["","誰が","何をした","状態",""].forEach(h=>th.append(el("th","",h)));
  const hd=el("thead"); hd.append(th);
  const bd=el("tbody");
  it.rows.forEach(rw=>{
    const tr=el("tr","hide"+(rw.bad?" bad":""));
    tr.append(el("td","",rw.t), el("td","who",rw.who), el("td","",rw.act),
              el("td","st",rw.state));
    const nt=el("td","note"); nt.innerHTML=md(rw.note); tr.append(nt);
    bd.append(tr);
  });
  tb.append(hd,bd); m.append(tb);
  for(let i=0;i<bd.children.length;i++){
    if(me!==run) return;
    bd.children[i].className=(it.rows[i].bad?"bad ":"")+"now";
    if(i>0) bd.children[i-1].className=it.rows[i-1].bad?"bad":"";
    await sleep(speed);
  }
  if(me===run&&bd.children.length)
    bd.children[bd.children.length-1].className=
      it.rows[it.rows.length-1].bad?"bad":"";
}

async function compare(m,it,me){
  const tb=el("table","lab"), th=el("tr");
  it.policies.forEach(p=>th.append(el("th","",p.name)));
  const hd=el("thead"); hd.append(th);
  const br=el("tr"); it.policies.forEach(()=>br.append(el("td","","—")));
  const bd=el("tbody"); bd.append(br);
  tb.append(hd,bd); m.append(tb);

  const ul=el("table"), ub=el("tbody");
  it.steps.forEach((s,i)=>{
    const tr=el("tr");
    tr.append(el("td","",i+1));
    const td=el("td",""); td.innerHTML=md(s.say); tr.append(td);
    ub.append(tr);
  });
  ul.append(ub); m.append(ul);

  const vd=el("div"); m.append(vd);
  const prev={};
  for(let i=0;i<it.steps.length;i++){
    if(me!==run) return;
    ub.children[i].className="now";
    if(i>0) ub.children[i-1].className="";
    it.policies.forEach((p,c)=>{
      const v=it.steps[i].state[p.key], td=br.children[c];
      td.textContent=v;
      td.className=(prev[p.key]!==undefined&&prev[p.key]!==v)?"chg":"";
      prev[p.key]=v;
    });
    await sleep(speed);
    it.policies.forEach((p,c)=>br.children[c].classList.remove("chg"));
  }
  if(me!==run) return;
  ub.children[it.steps.length-1].className="";
  it.policies.forEach(p=>{
    const ok=(it.good||[]).includes(p.key);
    const d=el("div","v"+(ok?" good":""));
    const t=el("span",""); t.innerHTML=md(it.verdict[p.key]);
    d.append(el("span","mark",ok?"✓":"✗"), el("span","who",p.name), t);
    vd.append(d);
  });
}

function matrix(m,it){
  const tb=el("table"), th=el("tr");
  th.append(el("th","",""));
  it.cols.forEach(c=>th.append(el("th","",c)));
  th.append(el("th","",""));
  const hd=el("thead"); hd.append(th);
  const bd=el("tbody");
  it.rows.forEach(rw=>{
    const tr=el("tr");
    const lb=el("td",""); lb.innerHTML="<b>"+md(rw.label)+"</b>"; tr.append(lb);
    rw.cells.forEach(c=>{const td=el("td",""); td.innerHTML=md(c); tr.append(td);});
    const nt=el("td","note"); nt.innerHTML=md(rw.note); tr.append(nt);
    bd.append(tr);
  });
  tb.append(hd,bd); m.append(tb);
}

//----------------------------------------------------------------------
// 選び方の木。押して辿る。
//----------------------------------------------------------------------
function flow(m,it){
  const box=el("div","flow"); m.append(box);
  const byId=id=>it.nodes.find(n=>n.id===id);
  let trail=[];

  function draw(id){
    box.textContent="";
    if(trail.length){
      const bc=el("div","trail");
      trail.forEach((t,i)=>{
        const b=el("button","crumb",t.label);
        b.onclick=()=>{trail=trail.slice(0,i); draw(t.from);};
        bc.append(b);
      });
      const rs=el("button","crumb reset","最初から");
      rs.onclick=()=>{trail=[]; draw(it.start);};
      bc.append(rs);
      box.append(bc);
    }
    const n=byId(id);
    if(!n){box.append(el("div","","?")); return;}
    if(n.q!==undefined){
      const q=el("div","q"); q.innerHTML=md(n.q); box.append(q);
      n.opts.forEach(op=>{
        const b=el("button","opt");
        b.innerHTML=md(op.label);
        b.onclick=()=>{trail=trail.concat([{label:strip(op.label),from:id}]);
                       draw(op.goto);};
        box.append(b);
      });
    } else {
      const a=el("div","ans");
      a.append(el("div","atitle","→ "+n.answer));
      const bd=el("div","abody"); bd.innerHTML=md(n.body); a.append(bd);
      const ul=el("ul","picks");
      (n.picks||[]).forEach(p=>{const li=el("li",""); li.innerHTML=md(p); ul.append(li);});
      a.append(ul);
      box.append(a);
    }
  }
  const strip=s=>String(s).replace(/\*\*/g,"");
  draw(it.start);

  // 参照用に木の全体も出す
  const ov=el("details","tree");
  ov.append(el("summary","","木の全体を開く"));
  it.nodes.filter(n=>n.q!==undefined).forEach(n=>{
    const d=el("div","tn");
    const h=el("div","tq"); h.innerHTML=md(n.q); d.append(h);
    n.opts.forEach(op=>{
      const t=byId(op.goto);
      const r=el("div","to");
      r.innerHTML=md(op.label)+' <span class="arw">→</span> '+
                  (t&&t.answer?("<b>"+t.answer+"</b>"):(t?md(t.q):"?"));
      d.append(r);
    });
    ov.append(d);
  });
  m.append(ov);
}

function notes(m,it){
  it.sections.forEach(sc=>{
    const d=el("div","sec");
    d.append(el("h3","",sc.head));
    const p=el("p",""); p.innerHTML=md(sc.body); d.append(p);
    (sc.items||[]).forEach(x=>{
      const r=el("div","it");
      const dd=el("span","d"); dd.innerHTML=md(x.desc);
      r.append(el("span","n",x.name), dd); d.append(r);
    });
    m.append(d);
  });
}

boot();
</script>
</body>
</html>
